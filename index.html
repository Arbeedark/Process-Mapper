<!DOCTYPE html>
<html lang="en">
<head>

<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>Process Mapper</title>
<style>
:root{
  --bg:#f8f9f6; --surface:#ffffff; --ink:#17382f; --muted:#5d7268; --line:#d5ded7; --soft:#e9eee9;
  --purple:#7340a9; --green:#00594c; --lime:#d8f16a; --black:#000;
  --step:var(--purple); --dec:var(--green); --end:#000;
  --yes-bg:#f0fad0; --no-bg:#efe8f6; --yes:#17382f; --no:#7340a9;
  --shadow:0 1px 2px rgba(23,56,47,.06),0 6px 18px rgba(23,56,47,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Outfit",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body.lock{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 12px) 16px 14px;background:#000;color:#fff;border-bottom:3px solid var(--lime);display:flex;align-items:center;gap:10px}
.top .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:2.4px;text-transform:uppercase;flex:1}
.top .sub{font-weight:600;font-size:13px;letter-spacing:2.2px;text-transform:uppercase;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:30px;height:30px;border-radius:9px;background:var(--lime);color:#000;display:grid;place-items:center}
.hbtn{background:rgba(255,255,255,.14);border:0;color:#fff;height:38px;min-width:38px;padding:0 14px;border-radius:19px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.hbtn.send{background:var(--lime);color:#000;font-weight:700}
main{max-width:640px;margin:0 auto;padding:18px 16px calc(120px + env(safe-area-inset-bottom))}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;color:var(--green);margin:6px 2px 0}
h1{font-size:30px;margin:2px 0 14px;letter-spacing:-.6px;line-height:1.1;font-weight:700}
h1 em{font-style:normal;color:var(--purple)}
.banner{background:var(--no-bg);color:var(--purple);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.pcard{background:var(--surface);border-radius:16px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow);cursor:pointer;display:flex;gap:12px;align-items:center;border:1px solid var(--line)}
.pcard .t{font-weight:650;font-size:18px;letter-spacing:-.2px}
.pcard .m{color:var(--muted);font-size:13px;margin-top:2px}
.pcard .ic{width:42px;height:42px;border-radius:12px;background:var(--purple);display:grid;place-items:center;flex:none;color:#fff}
.chev{margin-left:auto;color:var(--purple)}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));background:#000;color:var(--lime);border:0;border-radius:28px;height:54px;padding:0 28px;font-weight:700;font-size:15px;letter-spacing:2px;white-space:nowrap;text-transform:uppercase;box-shadow:0 10px 26px rgba(0,0,0,.3);cursor:pointer}
.field{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;outline:none}
.field:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(115,64,169,.22)}
.titlein{font-size:24px;font-weight:700;letter-spacing:-.4px}
textarea.field{resize:vertical;min-height:64px;line-height:1.4}
.lbl{display:block;font-size:12px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--green);margin:14px 2px 6px}
.chips{display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap}
.chip{background:var(--soft);border-radius:20px;padding:4px 12px;font-size:13px;color:var(--ink);font-weight:600}
.flow{position:relative;margin-top:18px}
.flow::before{content:"";position:absolute;left:19px;top:22px;bottom:22px;width:2px;background:var(--line)}
.item{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;position:relative}
.dot{width:36px;height:36px;margin:2px 2px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;border:3px solid var(--bg)}
.dot.step{background:var(--step)} .dot.end{background:var(--end);color:var(--lime)}
.dot.decision{background:var(--dec);border-radius:9px;transform:rotate(45deg);width:34px;height:34px;margin:4px 3px}
.dot.decision span{transform:rotate(-45deg)}
.card{background:var(--surface);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;border:1px solid var(--line);border-left:5px solid var(--step);min-width:0}
.card.decision{border-left-color:var(--dec)} .card.end{border-left-color:#000}
.kind{font-size:11px;font-weight:800;letter-spacing:1.6px;color:var(--step)}
.card.decision .kind{color:var(--dec)} .card.end .kind{color:#000}
.txt,.q{font-weight:600;font-size:17px;margin-top:2px;overflow-wrap:anywhere;white-space:pre-wrap;letter-spacing:-.1px}
.ph{color:var(--muted);font-weight:500;font-style:italic}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tagm{background:var(--soft);border-radius:8px;padding:3px 8px;font-size:12.5px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brs{display:grid;gap:8px;margin-top:10px}
.br{display:flex;gap:10px;border-radius:12px;padding:8px 10px;align-items:flex-start}
.br.yes{background:var(--yes-bg)} .br.no{background:var(--no-bg)}
.br .tag{font-size:11px;font-weight:800;letter-spacing:1.2px;border-radius:6px;padding:3px 7px;flex:none;margin-top:1px}
.br.yes .tag{background:var(--lime);color:#000;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)} .br.no .tag{background:var(--purple);color:#fff}
.bt{font-size:15px;min-width:0;overflow-wrap:anywhere}
.bt i{color:var(--muted)}
.go{font-size:12.5px;font-weight:700;color:var(--muted);margin-top:2px}
.gap{display:grid;grid-template-columns:40px 1fr;gap:12px;height:30px;align-items:center}
.plus{position:relative;z-index:1;width:24px;height:24px;margin-left:8px;border-radius:50%;border:2px solid var(--line);background:var(--bg);color:var(--purple);display:grid;place-items:center;padding:0;cursor:pointer}
.empty{text-align:center;padding:36px 12px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:20px;margin-bottom:6px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(248,249,246,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.bar .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.add{border:0;border-radius:14px;height:50px;font-weight:700;font-size:15px;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;gap:6px}
.add.step{background:var(--step)} .add.decision{background:var(--dec)} .add.end{background:#000;color:var(--lime)}
.sheet-wrap{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,0,0,.55);align-items:flex-end;justify-content:center}
.sheet-wrap.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet h2{margin:2px 0 4px;font-size:22px;letter-spacing:-.3px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border-radius:12px;padding:3px;margin:8px 0 0}
.seg button{border:0;background:transparent;border-radius:10px;height:38px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:#000;color:var(--lime)}
.bgrp{border-radius:14px;padding:10px 12px 12px;margin-top:12px}
.bgrp.yes{background:var(--yes-bg)} .bgrp.no{background:var(--no-bg)}
.bgrp h3{margin:0 0 6px;font-size:13px;letter-spacing:1.4px}
.bgrp.yes h3{color:var(--green)} .bgrp.no h3{color:var(--purple)}
.bgrp .field{margin-bottom:8px}
select.field{appearance:none;-webkit-appearance:none}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{flex:1;min-width:120px;border:1px solid var(--line);background:var(--surface);border-radius:14px;height:48px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink);padding:0 14px}
.btn.primary{background:var(--purple);border-color:var(--purple);color:#fff}
.btn.danger{color:#a3262a}
.btn.sm{height:42px;font-size:14px;min-width:0}
.hint{font-size:13px;color:var(--muted);margin:10px 2px 0}
.mono{font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre;overflow:auto;min-height:150px}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:14px}
.thumb{margin-top:12px;text-align:center;color:var(--muted);font-size:14px}
.thumb img{height:170px;margin:0 5px;vertical-align:top;border-radius:8px;border:1px solid var(--line);box-shadow:var(--shadow)}
.chk input{width:20px;height:20px;margin-top:1px;accent-color:var(--purple)}

.tog{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:14px;padding:4px;margin:12px 0 0}
.tog button{border:0;background:transparent;height:40px;border-radius:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;font-size:13px;color:var(--muted);cursor:pointer}
.tog button.on{background:#000;color:var(--lime)}
.legend{display:flex;gap:16px;margin:12px 4px 8px;font-size:13px;font-weight:600;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.lg{display:inline-block;width:16px;height:12px}
.lg.step{border:2px solid var(--purple);border-radius:4px;background:#fff}
.lg.dec{background:var(--green);transform:rotate(45deg) scale(.8);width:12px;height:12px}
.lg.end{background:#000;border-radius:6px}
.mapbox{position:relative}
.mapwrap{height:calc(100vh - 430px);height:calc(100dvh - 430px);min-height:300px;overflow:auto;border-radius:18px;border:1px solid var(--line);background-color:#fff;background-image:radial-gradient(var(--line) 1.4px,transparent 1.4px);background-size:22px 22px;touch-action:pan-x pan-y pinch-zoom;-webkit-overflow-scrolling:touch}
.mapwrap svg{display:block}
.mn{cursor:pointer;transition:opacity .2s}
.mn:not([data-act]){cursor:default}
.lbl{cursor:pointer}
.zoom{position:absolute;right:10px;top:10px;z-index:3;display:flex;background:#000;border-radius:20px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.zoom button{border:0;background:transparent;color:var(--lime);height:38px;min-width:42px;padding:0 10px;font-weight:700;font-size:16px;cursor:pointer}
main.mapmain{padding-bottom:calc(230px + env(safe-area-inset-bottom))}
.mpanel{position:fixed;left:0;right:0;bottom:0;z-index:15;max-width:640px;margin:0 auto;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -8px 28px rgba(23,56,47,.18);border-top:3px solid var(--lime);padding:14px 18px calc(14px + env(safe-area-inset-bottom));max-height:42vh;overflow:auto}
.mp-h{display:flex;align-items:center;gap:8px}
.mp-sp{flex:1}
.mp-k{font-size:12px;font-weight:800;letter-spacing:1.6px;border-radius:8px;padding:4px 10px;background:var(--purple);color:#fff}
.mp-k.decision{background:var(--green)} .mp-k.end{background:#000;color:var(--lime)}
.mp-b{border:1px solid var(--line);background:#fff;border-radius:16px;height:32px;padding:0 14px;font-weight:700;font-size:13px;cursor:pointer}
.mp-t{font-size:19px;font-weight:700;letter-spacing:-.2px;margin-top:8px;overflow-wrap:anywhere}
.mp-s{font-size:14px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.mp-r{margin-top:12px}
.mp-r .btn{min-width:0}
.btn.yes{background:var(--lime);border-color:rgba(0,0,0,.2);color:#000}
.btn.no{background:var(--purple);border-color:var(--purple);color:#fff}

.tcard{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tc{border-radius:16px;padding:12px 14px}
.tc span{display:block;font-size:11px;font-weight:800;letter-spacing:1.6px}
.tc b{display:block;font-size:26px;letter-spacing:-.4px;margin-top:2px}
.tc.best{background:var(--lime);color:#000}
.tc.worst{background:var(--purple);color:#fff}
.tnote{grid-column:1/-1;font-size:12.5px;color:var(--muted);margin:0 2px}
.trow{display:flex;gap:8px;align-items:center}
.trow .field{min-width:0;flex:1}
.trow select{flex:1.3}
.tto{color:var(--muted);font-weight:600}
.tpaths{display:flex;gap:10px;margin:12px 0 0}
.tpaths button{flex:1;height:40px;border-radius:12px;border:2px solid transparent;font-weight:700;cursor:pointer;font-size:14px;opacity:.7}
.tpaths button.on{opacity:1;border-color:#000}
.tpaths .best{background:var(--lime);color:#000}
.tpaths .worst{background:var(--purple);color:#fff}
.mapwrap.tp{height:calc(100vh - 484px);height:calc(100dvh - 484px)}
.mp-k.bestk{background:var(--lime);color:#000}
</style>

<body>
<div id="app"></div>
<div id="sheet" class="sheet-wrap"><div class="sheet" id="sheetBody"></div></div>

<script>
// <logic>
function numMap(p){var m={};p.nodes.forEach(function(n,i){m[n.id]=i+1});return m;}
function dest(p,next,i){
  var m=numMap(p);
  if(next==='end')return {label:'End process'};
  if(next&&next!=='next'&&m[next])return {label:'Go to step '+m[next]};
  return i+1<p.nodes.length?{label:'Continue to step '+(i+2)}:{label:'End process'};
}
function buildText(p,opts){
  var L=[],nodes=p.nodes,pdf=opts&&opts.pdf,rule='────────────────────────';
  var steps=nodes.filter(function(n){return n.type==='step'}).length;
  var decs=nodes.filter(function(n){return n.type==='decision'}).length;
  L.push('PROCESS MAP: '+(p.title&&p.title.trim()?p.title.trim():'Untitled process'));
  L.push(steps+' step'+(steps===1?'':'s')+' · '+decs+' decision'+(decs===1?'':'s')+(pdf?' · full flowchart attached (PDF)':''));
  var T=calcTimes(p);
  if(T.any&&(T.best||T.worst)){L.push('Time: best case '+(T.best?fmtDur(T.best.t):'n/a')+' · worst case '+(T.worst?fmtDur(T.worst.t):'n/a'));L.push('('+timeNote(T)+')');}
  if(p.notes&&p.notes.trim()){L.push('');L.push(rule);L.push('OVERVIEW');L.push(p.notes.trim());}
  L.push('');L.push(rule);L.push('FLOW');L.push('');
  if(!nodes.length){L.push('(no steps yet)');}
  nodes.forEach(function(n,i){
    var t=((n.text||'').trim()||'(untitled)'),own=[(n.owner||'').trim(),fmtRange(n)].filter(Boolean).join(' · ');own=own?'  ['+own+']':'';
    var pre=n.type==='decision'?'DECISION: ':n.type==='end'?'END: ':'';
    L.push((i+1)+'. '+pre+t+own);
    if(n.type==='decision'){
      ['yes','no'].forEach(function(b){
        var br=n[b]||{},d=dest(p,br.next,i),bt=(br.text||'').trim(),mark=b==='yes'?'✔ Yes':'✘ No';
        var jump=/^Go to step/.test(d.label)?' → step '+d.label.replace('Go to step ',''):(d.label==='End process'?' → end':'');
        L.push('   '+mark+': '+(bt||(jump?'':'continue'))+jump);
      });
    }
    if(n.note&&n.note.trim())L.push('   Note: '+n.note.trim().replace(/\n/g,'\n         '));
    L.push('');
  });
  return L.join('\n').replace(/\s+$/,'');
}
function enc(p){return btoa(unescape(encodeURIComponent(JSON.stringify(p))));}
function dec(s){return JSON.parse(decodeURIComponent(escape(atob(s))));}
function parseImport(text){
  var m=/PROCMAP-DATA>>([\s\S]*?)<<END/.exec(text);
  var o=m?dec(m[1].replace(/\s+/g,'')):JSON.parse(text);
  if(!o||!Array.isArray(o.nodes))throw new Error('Not a process map');
  return o;
}

var UF={min:1,hr:60,day:480},UL={min:'min',hr:'h',day:'d'};
function tgtIdx(p,next,i){var m=numMap(p);if(next==='end')return null;if(next&&next!=='next'&&m[next]&&m[next]-1!==i)return m[next]-1;return i+1<p.nodes.length?i+1:null}
function fmtNum(x){return String(+(+x).toFixed(2))}
function fmtDur(m){
  m=Math.round(m);if(m<60)return m+' min';
  if(m<480){var h=Math.floor(m/60),r=m%60;return h+' h'+(r?' '+r+' min':'')}
  var d=Math.floor(m/480),rem=m-d*480,h2=Math.floor(rem/60),r2=rem%60,s=d+' d';
  if(h2)s+=' '+h2+' h';else if(r2)s+=' '+r2+' min';
  return s;
}
function fmtRange(n){
  if(!n||n.type!=='step')return '';
  var a=n.tmin==null?null:+n.tmin,b=null;if(a==null&&b==null)return '';
  var lo=a==null?b:a,hi=b==null?lo:Math.max(b,lo),u=UF[n.tunit]?n.tunit:'min',f=UF[u];
  return (hi>lo?fmtNum(lo/f)+'–'+fmtNum(hi/f):fmtNum(lo/f))+' '+UL[u];
}
function nodeCost(n){
  if(n.type!=='step')return [0,0];
  var a=n.tmin==null?null:+n.tmin,b=null;if(a==null&&b==null)return [0,0];
  var lo=a==null?b:a,hi=b==null?lo:Math.max(b,lo);return [lo,hi];
}
function calcTimes(p){
  var N=p.nodes.length,steps=0,timed=0,i;
  for(i=0;i<N;i++){var n=p.nodes[i];if(n.type==='step'){steps++;if(n.tmin!=null||n.tmax!=null)timed++}}
  var r={any:timed>0,steps:steps,timed:timed,best:null,worst:null};
  if(!r.any||!N)return r;
  var succ=[],term=[];
  p.nodes.forEach(function(n2,j){
    var o=[];
    if(n2.type==='decision'){['yes','no'].forEach(function(b){o.push(tgtIdx(p,(n2[b]||{}).next,j))})}
    else if(n2.type!=='end'){o.push(j+1<N?j+1:null)}
    succ[j]=o.filter(function(t){return t!=null});
    term[j]=n2.type==='end'||o.some(function(t){return t==null});
  });
  var dist=[],prev=[],done=[];
  for(i=0;i<N;i++)dist[i]=Infinity;
  dist[0]=nodeCost(p.nodes[0])[0];
  for(var it=0;it<N;it++){
    var u=-1;for(i=0;i<N;i++)if(!done[i]&&dist[i]<Infinity&&(u<0||dist[i]<dist[u]))u=i;
    if(u<0)break;done[u]=true;
    succ[u].forEach(function(v){var c=dist[u]+nodeCost(p.nodes[v])[0];if(c<dist[v]){dist[v]=c;prev[v]=u}});
  }
  var bi=-1;for(i=0;i<N;i++)if(term[i]&&dist[i]<Infinity&&(bi<0||dist[i]<dist[bi]))bi=i;
  if(bi>=0){var pa=[],c=bi;while(c!=null&&pa.length<=N+1){pa.unshift(c);c=prev[c]}r.best={t:dist[bi],path:pa}}
  var visits=[],budget=200000,bw=null;
  for(i=0;i<N;i++)visits[i]=0;
  (function dfs(u,cost,path){
    if(budget--<=0)return;
    visits[u]++;path.push(u);cost+=nodeCost(p.nodes[u])[1];
    if(term[u]&&(!bw||cost>bw.t))bw={t:cost,path:path.slice()};
    succ[u].forEach(function(v){if(visits[v]<2)dfs(v,cost,path)});
    path.pop();visits[u]--;
  })(0,0,[]);
  if(bw){var seen={},loop=false;bw.path.forEach(function(x){if(seen[x])loop=true;seen[x]=1});bw.loop=loop;r.worst=bw}
  return r;
}
function timeNote(T){
  var big=Math.max(T.best?T.best.t:0,T.worst?T.worst.t:0)>=480;
  return T.timed+' of '+T.steps+' step'+(T.steps===1?'':'s')+' timed'+(T.worst&&T.worst.loop?' · loops counted once':'')+(big?' · 1 d = 8 working hrs':'');
}
// </logic>

var KEY='procmap.v1';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid=function(){return Math.random().toString(36).slice(2,9)};
var trunc=function(s,n){s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s};

var memOnly=false,db,state={view:'lib',id:null},ctx=null;

function blank(type){return {id:uid(),type:type,text:'',owner:'',note:'',yes:{text:'',next:'next'},no:{text:'',next:type==='decision'?'end':'next'}}}
function sample(){
  var n=function(id,type,text,extra){var o=blank(type);o.id=id;o.text=text;for(var k in extra)o[k]=extra[k];return o};
  return {id:uid(),title:'Example: handle a refund request',notes:'A worked example showing steps, a decision with two outcomes, and notes. Edit it or delete it.',updated:Date.now(),nodes:[
    n('n1','step','Receive refund request',{owner:'Support',note:'Log it in the helpdesk as soon as it arrives.'}),
    n('n2','step','Check order date and payment method',{owner:'Support'}),
    n('n3','decision','Is the order within 30 days?',{yes:{text:'Approve the refund',next:'next'},no:{text:'Offer store credit instead',next:'n6'},note:'Exceptions need manager sign-off.'}),
    n('n4','step','Issue refund to original payment method',{owner:'Finance',note:'Takes 3-5 working days to appear.'}),
    n('n5','end','Email customer confirmation and close ticket'),
    n('n6','step','Issue store credit and email the code',{owner:'Support'}),
    n('n7','end','Close ticket')
  ]};
}
function lsOK(){try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true}catch(e){return false}}
function init(){
  memOnly=!lsOK();var raw=null;
  if(!memOnly){try{raw=JSON.parse(localStorage.getItem(KEY))}catch(e){}}
  db=(raw&&Array.isArray(raw.procs))?raw:{procs:[sample()],email:''};
  if(!db.email)db.email='';
}
function save(){if(memOnly)return;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){memOnly=true}}
function cur(){return db.procs.filter(function(p){return p.id===state.id})[0]}
function touch(){var p=cur();if(p)p.updated=Date.now();save()}
function setPath(o,path,v){var k=path.split('.');for(var i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v}
function fmt(t){return new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}

var I={
 back:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
 chev:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
 mail:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 8l9 6 9-6"/></svg>',
 flow:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="6" rx="2"/><rect x="14" y="15" width="7" height="6" rx="2"/><path d="M6.5 9v3.5a2 2 0 0 0 2 2H14"/></svg>',
 dots:'<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>'
};

var lastKey='',curG=null;
function render(){
  var ow=$('#mapwrap'),sc=ow?{l:ow.scrollLeft,t:ow.scrollTop}:null,key=state.view+':'+state.id,y=window.pageYOffset;
  $('#app').innerHTML=state.view==='lib'?libView():procView();
  var nw=$('#mapwrap');if(sc&&nw){nw.scrollLeft=sc.l;nw.scrollTop=sc.t}
  if(key!==lastKey){window.scrollTo(0,0);lastKey=key}else window.scrollTo(0,y);
}
function libView(){
  var list=db.procs.slice().sort(function(a,b){return b.updated-a.updated}).map(function(p){
    var d=p.nodes.filter(function(n){return n.type==='decision'}).length;
    return '<div class="pcard" data-act="open" data-id="'+p.id+'"><div class="ic">'+I.flow+'</div><div style="min-width:0"><div class="t">'+esc(p.title||'Untitled process')+'</div><div class="m">'+p.nodes.length+' steps · '+d+' decision'+(d===1?'':'s')+' · '+fmt(p.updated)+'</div></div><span class="chev">'+I.chev+'</span></div>';
  }).join('');
  return '<header class="top"><div class="brand"><span class="logo">'+I.flow+'</span>Process Mapper</div><button class="hbtn" data-act="import">Import</button></header>'+
  '<main>'+(memOnly?'<div class="banner">This view can\'t save on your device, so maps vanish when you close it. Email each map to yourself to keep it.</div>':'')+
  '<div class="eyebrow">Library</div><h1>Your <em>processes.</em></h1>'+(list||'<div class="empty"><b>Nothing mapped yet</b>Tap New process to start.</div>')+'</main>'+
  '<button class="fab" data-act="new">+ New process</button>';
}
function ph(t){return '<span class="ph">'+t+'</span>'}
function item(p,n,i){
  var body='';
  if(n.type==='decision'){
    body='<div class="q">'+(n.text?esc(n.text):ph('Tap to add the question'))+'</div><div class="brs">'+
    ['yes','no'].map(function(b){var br=n[b]||{},d=dest(p,br.next,i);
      return '<div class="br '+b+'"><span class="tag">'+b.toUpperCase()+'</span><div class="bt">'+(br.text?esc(br.text):'<i>No action</i>')+'<div class="go">→ '+esc(d.label)+'</div></div></div>'}).join('')+'</div>';
  }else body='<div class="txt">'+(n.text?esc(n.text):ph(n.type==='end'?'Tap to describe the outcome':'Tap to describe this step'))+'</div>';
  var meta='';
  if(n.owner)meta+='<span class="tagm">👤 '+esc(n.owner)+'</span>';
  var trg=fmtRange(n);if(trg)meta+='<span class="tagm">⏱ '+esc(trg)+'</span>';
  if(n.note)meta+='<span class="tagm">📝 '+esc(trunc(n.note.replace(/\n/g,' '),48))+'</span>';
  return '<div class="item"><div class="dot '+n.type+'"><span>'+(i+1)+'</span></div><div class="card '+n.type+'" data-act="edit" data-id="'+n.id+'"><div class="kind">'+n.type.toUpperCase()+'</div>'+body+(meta?'<div class="meta">'+meta+'</div>':'')+'</div></div>';
}
function timeCard(T){
  if(!T.any||(!T.best&&!T.worst))return '';
  return '<div class="tcard"><div class="tc best"><span>BEST CASE</span><b>'+(T.best?fmtDur(T.best.t):'n/a')+'</b></div><div class="tc worst"><span>WORST CASE</span><b>'+(T.worst?fmtDur(T.worst.t):'n/a')+'</b></div><div class="tnote">'+timeNote(T)+'</div></div>';
}
function pathBtns(T){
  if(!T.any||(!T.best&&!T.worst))return '';
  function b(m,l,pp){return pp?'<button data-act="path" data-m="'+m+'" class="'+m+(state.pathMode===m?' on':'')+'">'+l+' · '+fmtDur(pp.t)+'</button>':''}
  return '<div class="tpaths">'+b('best','Best case',T.best)+b('worst','Worst case',T.worst)+'</div>';
}
function procView(){
  var p=cur(),mode=db.mode==='map'?'map':'list';
  var tog='<div class="tog"><button data-act="mode" data-m="list" class="'+(mode==='list'?'on':'')+'">List</button><button data-act="mode" data-m="map" class="'+(mode==='map'?'on':'')+'">Map</button></div>';
  var st=p.nodes.filter(function(n){return n.type==='step'}).length,dc=p.nodes.filter(function(n){return n.type==='decision'}).length;
  var flow=p.nodes.length?'<div class="flow">'+p.nodes.map(function(n,i){
    return item(p,n,i)+(i<p.nodes.length-1?'<div class="gap"><button class="plus" data-act="ins" data-i="'+i+'" aria-label="Insert after step '+(i+1)+'"><svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 1v10M1 6h10"/></svg></button><span></span></div>':'');
  }).join('')+'</div>':'<div class="empty"><b>Start mapping</b>Add the first step below. Use a decision when the path splits into yes and no.</div>';
  return '<header class="top"><button class="hbtn" data-act="back" aria-label="Back">'+I.back+'</button><div class="sub">Process map</div><button class="hbtn" data-act="menu" aria-label="More">'+I.dots+'</button><button class="hbtn send" data-act="mail">'+I.mail+' Email</button></header>'+
  '<main'+(mode==='map'?' class="mapmain"':'')+'><input class="field titlein" data-pf="title" placeholder="Name this process" value="'+esc(p.title)+'">'+tog+
  (mode==='map'?mapBlock(p):
  '<textarea class="field" data-pf="notes" rows="2" style="margin-top:10px" placeholder="Overview and notes (optional): purpose, owner, tools, when it runs">'+esc(p.notes)+'</textarea>'+
  '<div class="chips"><span class="chip">'+st+' step'+(st===1?'':'s')+'</span><span class="chip">'+dc+' decision'+(dc===1?'':'s')+'</span></div>'+timeCard(calcTimes(p))+flow)+'</main>'+
  (mode==='map'?mapPanel(p):'<div class="bar"><div class="in"><button class="add step" data-act="add" data-t="step">+ Step</button><button class="add decision" data-act="add" data-t="decision">+ Decision</button><button class="add end" data-act="add" data-t="end">+ End</button></div></div>');
}

/* ---------- on-screen process map ---------- */
var mctx=document.createElement('canvas').getContext('2d');
var MC={step:'#7340a9',dec:'#00594c',lime:'#d8f16a',ink:'#17382f',muted:'#5d7268',bg:'#f8f9f6'};
function pathStr(pts,r){
  var d='M'+pts[0].x+' '+pts[0].y;
  for(var i=1;i<pts.length-1;i++){
    var a=pts[i-1],b=pts[i],c=pts[i+1],l1=Math.hypot(b.x-a.x,b.y-a.y),l2=Math.hypot(c.x-b.x,c.y-b.y),q=Math.min(r,l1/2,l2/2);
    d+=' L'+(b.x-(b.x-a.x)/l1*q)+' '+(b.y-(b.y-a.y)/l1*q)+' Q'+b.x+' '+b.y+' '+(b.x+(c.x-b.x)/l2*q)+' '+(b.y+(c.y-b.y)/l2*q);
  }
  var e=pts[pts.length-1];return d+' L'+e.x+' '+e.y;
}
function svgText(lines,cx,y0,lh,size,fill,weight){
  return lines.map(function(l,k){return '<text x="'+cx+'" y="'+(y0+k*lh)+'" text-anchor="middle" font-size="'+size+'" font-weight="'+weight+'" fill="'+fill+'">'+esc(l)+'</text>'}).join('');
}
function svgBadge(x,y,num,bg,fg){
  return '<circle cx="'+x+'" cy="'+y+'" r="26" fill="'+MC.bg+'"/><circle cx="'+x+'" cy="'+y+'" r="21" fill="'+bg+'"/><text x="'+x+'" y="'+(y+8)+'" text-anchor="middle" font-size="23" font-weight="700" fill="'+fg+'">'+num+'</text>';
}
function svgNode(v,opac,sel){
  var x=v.cx-v.w/2,y=v.cy-v.h/2,g='',act=v.virtual?'':' data-act="mnode" data-i="'+v.i+'"';
  var ring=sel?'<g fill="none" stroke="'+MC.lime+'" stroke-width="14" stroke-linejoin="round" opacity=".95">':'';
  if(v.type==='decision'){
    var pts=[[v.cx,y],[v.cx+v.w/2,v.cy],[v.cx,y+v.h],[v.cx-v.w/2,v.cy]].map(function(q){return q.join(',')}).join(' ');
    if(sel)ring+='<polygon points="'+pts+'"/>';
    g+='<polygon points="'+pts+'" fill="'+MC.dec+'"/>'+svgText(v.lines,v.cx,v.cy-v.lines.length*17+25,34,25,'#fff',600);
    g+=svgBadge(v.cx-v.w/4-4,v.cy-v.h/4-4,v.i+1,MC.lime,'#000');
  }else if(v.virtual){
    var rx=v.h/2;if(sel)ring+='<rect x="'+x+'" y="'+y+'" width="'+v.w+'" height="'+v.h+'" rx="'+rx+'"/>';
    g+='<rect x="'+x+'" y="'+y+'" width="'+v.w+'" height="'+v.h+'" rx="'+rx+'" fill="'+(v.start?MC.lime:'#000')+'"/><text x="'+v.cx+'" y="'+(v.cy+9)+'" text-anchor="middle" font-size="24" font-weight="800" letter-spacing="5" fill="'+(v.start?'#000':MC.lime)+'">'+(v.start?'START':'END')+'</text>';
  }else if(v.type==='end'){
    var r2=Math.min(v.h/2,40);if(sel)ring+='<rect x="'+x+'" y="'+y+'" width="'+v.w+'" height="'+v.h+'" rx="'+r2+'"/>';
    g+='<rect x="'+x+'" y="'+y+'" width="'+v.w+'" height="'+v.h+'" rx="'+r2+'" fill="#000"/>'+svgText(v.lines,v.cx,v.cy-v.lines.length*17+25,34,26,'#fff',600)+svgBadge(x+2,v.cy,v.i+1,MC.lime,'#000');
  }else{
    var band=v.owner?40:0,area=v.h-band;
    if(sel)ring+='<rect x="'+x+'" y="'+y+'" width="'+v.w+'" height="'+v.h+'" rx="22"/>';
    g+='<rect x="'+x+'" y="'+y+'" width="'+v.w+'" height="'+v.h+'" rx="22" fill="#fff"/>';
    if(v.owner){
      g+='<path d="M'+x+' '+(y+v.h-band)+' H'+(x+v.w)+' V'+(y+v.h-22)+' A22 22 0 0 1 '+(x+v.w-22)+' '+(y+v.h)+' H'+(x+22)+' A22 22 0 0 1 '+x+' '+(y+v.h-22)+' Z" fill="#efe8f6"/>';
      g+='<line x1="'+(x+8)+'" y1="'+(y+v.h-band)+'" x2="'+(x+v.w-8)+'" y2="'+(y+v.h-band)+'" stroke="'+MC.step+'" stroke-opacity=".45" stroke-width="2" stroke-dasharray="6 6"/>';
      g+='<text x="'+v.cx+'" y="'+(y+v.h-13)+'" text-anchor="middle" font-size="21" font-weight="600" fill="'+MC.muted+'">'+esc(v.owner)+'</text>';
    }
    g+='<rect x="'+x+'" y="'+y+'" width="'+v.w+'" height="'+v.h+'" rx="22" fill="none" stroke="'+MC.step+'" stroke-width="4"/>';
    g+=svgText(v.lines,v.cx,y+area/2-v.lines.length*17+25,34,26,MC.ink,600)+svgBadge(x+4,y+4,v.i+1,MC.step,'#fff');
  }
  if(sel)ring+='</g>';
  return '<g class="mn" style="opacity:'+opac+'"'+act+'>'+ring+g+'</g>';
}
function mapSvg(G,sel,z,via,hl){
  var near={},out=[],selDec=sel!=null&&G.nodes[sel]&&G.nodes[sel].type==='decision';
  if(sel!=null){near[sel]=1;if(!selDec)G.edges.forEach(function(e){if(e.from===sel)near[e.to]=1})}
  if(via&&via.to===sel)near[via.from]=.75;
  var labels=[];
  function ek(e){return (e.from>=G.N?'s':e.from)+'>'+(e.to>=G.N?'v':e.to)}
  if(hl)G.edges.forEach(function(e){if(hl.edges[ek(e)]&&e.to>=G.N)near[e.to]=1});
  G.edges.forEach(function(e){
    var r=route(G,e),pts=r.pts,n=pts.length,a=pts[n-2],b=pts[n-1],dx=Math.sign(b.x-a.x),dy=Math.sign(b.y-a.y),AH=17;
    var q=pts.slice();q[n-1]={x:b.x-dx*AH,y:b.y-dy*AH};
    var col=e.kind==='yes'?MC.dec:e.kind==='no'?MC.step:'#4f6b61',taken=via&&via.to===sel&&e.from===via.from&&e.kind===via.kind,onp=hl&&hl.edges[ek(e)],op=hl?(onp?1:.16):(sel==null?1:taken?1:(e.from===sel?(selDec?.35:1):.16)),w=(onp||taken||(!hl&&sel!=null&&e.from===sel&&!selDec))?5:3.5;
    out.push('<g opacity="'+op+'"><path d="'+pathStr(q,18)+'" fill="none" stroke="'+col+'" stroke-width="'+w+'" stroke-linecap="round"/><polygon fill="'+col+'" points="'+b.x+','+b.y+' '+(b.x-dx*AH-dy*9)+','+(b.y-dy*AH+dx*9)+' '+(b.x-dx*AH+dy*9)+','+(b.y-dy*AH-dx*9)+'"/></g>');
    if(e.kind!=='seq'){var yes=e.kind==='yes',pos=r.useR?{x:r.sr.x+44,y:r.sr.y-26}:{x:r.sb.x+48,y:r.sb.y+26};
      labels.push('<g class="lbl" data-act="mnext" data-from="'+e.from+'" data-i="'+e.to+'" data-k="'+e.kind+'" opacity="'+Math.max(op,.45)+'"><rect x="'+(pos.x-52)+'" y="'+(pos.y-30)+'" width="104" height="60" fill="transparent"/><rect x="'+(pos.x-34)+'" y="'+(pos.y-17)+'" width="68" height="34" rx="17" fill="'+(yes?MC.lime:MC.step)+'"'+(yes?' stroke="rgba(0,0,0,.25)" stroke-width="2"':'')+'/><text x="'+pos.x+'" y="'+(pos.y+7)+'" text-anchor="middle" font-size="19" font-weight="800" letter-spacing="3" fill="'+(yes?'#000':'#fff')+'">'+(yes?'YES':'NO')+'</text></g>')}
  });
  var nodes=G.nodes.map(function(v){var o=hl?((hl.nodes[v.i]||v.start||near[v.i])?1:.4):(sel==null?1:(near[v.i]===undefined?.4:(near[v.i]===true?1:near[v.i])));return svgNode(v,o,sel===v.i)}).join('');
  return '<svg id="msvg" xmlns="http://www.w3.org/2000/svg" width="'+Math.round(G.natW*z)+'" height="'+Math.round(G.natH*z)+'" viewBox="0 0 '+G.natW+' '+G.natH+'" style="font-family:Outfit,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">'+out.join('')+nodes+labels.join('')+'</svg>';
}
function mapBlock(p){
  if(!p.nodes.length)return '<div class="empty"><b>Nothing to map yet</b>Add steps in List view and they appear here.</div>';
  var G=buildGraph(p);sizeGraph(mctx,G);curG=G;
  var ww=Math.min(window.innerWidth,640)-32;
  if(state.zoom==null)state.zoom=Math.max(.5,Math.min(1,ww/G.natW));
  var z=state.zoom,sel=(state.sel!=null&&state.sel<p.nodes.length)?state.sel:null,T=calcTimes(p),hl=null;
  if(state.pathMode&&!state.sel&&state.sel!==0){var pp=state.pathMode==='best'?T.best:T.worst;
    if(pp){hl={nodes:{},edges:{'s>0':1}};pp.path.forEach(function(x,k){hl.nodes[x]=1;if(k<pp.path.length-1)hl.edges[x+'>'+pp.path[k+1]]=1});hl.edges[pp.path[pp.path.length-1]+'>v']=1}}
  return pathBtns(T)+'<div class="legend"><span><i class="lg step"></i>Step</span><span><i class="lg dec"></i>Decision</span><span><i class="lg end"></i>End</span></div>'+
   '<div class="mapbox"><div class="zoom"><button data-act="zout" aria-label="Zoom out">&minus;</button><button data-act="zfit" aria-label="Fit">Fit</button><button data-act="zin" aria-label="Zoom in">+</button></div><div class="mapwrap'+(T.any&&(T.best||T.worst)?' tp':'')+'" id="mapwrap">'+mapSvg(G,sel,z,state.via,hl)+'</div></div>';
}
function mapPanel(p){
  var i=state.sel,n=(i!=null&&p.nodes[i])?p.nodes[i]:null,h='<div class="mpanel">';
  if(state.pathMode&&i==null){
    var T2=calcTimes(p),pm=state.pathMode,pp2=pm==='best'?T2.best:T2.worst,other=pm==='best'?'worst':'best';
    if(pp2){return h+'<div class="mp-h"><span class="mp-k '+(pm==='best'?'bestk':'')+'">'+(pm==='best'?'BEST CASE':'WORST CASE')+'</span><span class="mp-sp"></span><button class="mp-b" data-act="path" data-m="'+pm+'">Clear</button></div><div class="mp-t">'+fmtDur(pp2.t)+'</div><div class="mp-s">Route: '+pp2.path.map(function(x){return x+1}).join(' → ')+'</div><div class="mp-s">'+(pm==='worst'&&pp2.loop?'Loops are counted once. ':'')+'Steps without a time count as 0.</div><div class="row mp-r"><button class="btn sm" data-act="path" data-m="'+other+'">Show '+other+' case</button></div></div>'}
  }
  if(!p.nodes.length)return h+'<div class="mp-s">Add steps in List view to build your map.</div></div>';
  if(!n)return h+'<div class="mp-t">Follow the flow</div><div class="mp-s">Tap any box on the map, or start at the beginning and tap through.</div><div class="row" style="margin-top:10px"><button class="btn primary" data-act="mstart">Start at step 1</button></div></div>';
  var kind=n.type.toUpperCase(),hist=(state.hist&&state.hist.length)?'':' disabled style="opacity:.4"';
  h+='<div class="mp-h"><span class="mp-k '+n.type+'">'+(i+1)+' · '+kind+'</span><span class="mp-sp"></span><button class="mp-b" data-act="mback"'+hist+'>Back</button><button class="mp-b" data-act="medit">Edit</button></div>';
  h+='<div class="mp-t">'+esc((n.text&&n.text.trim())||'(untitled)')+'</div>';
  var meta=[];if(n.owner&&n.owner.trim())meta.push('Owner: '+esc(n.owner.trim()));if(n.note&&n.note.trim())meta.push(esc(n.note.trim()));
  if(meta.length)h+='<div class="mp-s">'+meta.join(' · ')+'</div>';
  h+='<div class="row mp-r">';
  function go(label,cls,t){return t==null?'<button class="btn sm '+cls+'" disabled style="opacity:.55">'+label+' · ends here</button>':'<button class="btn sm '+cls+'" data-act="mnext" data-k="'+(cls==='yes'||cls==='no'?cls:'seq')+'" data-i="'+t+'">'+label+' → '+(t+1)+'</button>'}
  if(n.type==='decision'){
    ['yes','no'].forEach(function(b){var br=n[b]||{},t=tgtIdx(p,br.next,i);h+=go(b.toUpperCase()+((br.text&&br.text.trim())?' · '+esc(trunc(br.text.trim(),22)):''),b,t)});
  }else if(n.type==='end'){h+='<button class="btn sm" data-act="mstart">Restart</button>'}
  else{var t2=tgtIdx(p,'next',i);h+=go('Next','primary',t2)}
  return h+'</div></div>';
}
function parseNum(v){v=String(v).replace(',','.').trim();if(v==='')return null;var x=parseFloat(v);return isFinite(x)&&x>=0?x:null}
function readTime(){
  var p=cur(),n=p&&ctx&&p.nodes.filter(function(x){return x.id===ctx.id})[0];if(!n)return;
  var u=$('#tu').value,f=UF[u]||1,a=parseNum($('#tf1').value);

}
function selectNode(i,push,via){
  state.pathMode=null;
  state.hist=state.hist||[];state.via=via||null;
  if(push&&state.sel!=null&&state.sel!==i)state.hist.push(state.sel);
  state.sel=i;render();
  var w=$('#mapwrap'),v=curG&&curG.nodes[i];
  if(w&&v){var z=state.zoom;w.scrollTo({left:Math.max(0,v.cx*z-w.clientWidth/2),top:Math.max(0,v.cy*z-w.clientHeight/2),behavior:'smooth'})}

function openSheet(html){$('#sheetBody').innerHTML='<div class="grab"></div>'+html;$('#sheet').classList.add('open');document.body.classList.add('lock')}
function closeSheet(){
  var p=state.id&&cur();
  if(ctx&&ctx.fresh&&p){var n=p.nodes.filter(function(x){return x.id===ctx.id})[0];
    if(n&&!n.text.trim()&&!n.note.trim()&&!(n.yes.text||n.no.text)){p.nodes.splice(p.nodes.indexOf(n),1);save()}}
  ctx=null;$('#sheet').classList.remove('open');document.body.classList.remove('lock');
  if(p||state.view==='lib')render();
}
function addNode(type,at){
  var p=cur(),n=blank(type);
  if(at==null||at>p.nodes.length)at=p.nodes.length;
  p.nodes.splice(at,0,n);touch();render();
  ctx={kind:'edit',id:n.id,fresh:true};editSheet();
}
function nodeOpts(p,n,sel){
  var ok=sel==='end'||sel==='next'||p.nodes.some(function(m){return m.id===sel&&m!==n});
  if(!ok)sel='next';
  var h='<option value="next"'+(sel==='next'?' selected':'')+'>Continue to next step</option>';
  p.nodes.forEach(function(m,j){if(m===n)return;
    h+='<option value="'+m.id+'"'+(sel===m.id?' selected':'')+'>Go to step '+(j+1)+(m.text?': '+esc(trunc(m.text,34)):'')+'</option>'});
  return h+'<option value="end"'+(sel==='end'?' selected':'')+'>End process</option>';
}
function editSheet(){

  openSheet('<h2>Step '+(i+1)+'</h2>'+seg+main+owner+timeF+

var PW=1240,PH=1754,LW=1754,LH=1240,PM=84,FONT='"Outfit",Helvetica,Arial,sans-serif';
var C={bg:'#f8f9f6',ink:'#17382f',muted:'#5d7268',line:'#d5ded7',soft:'#e9eee9',alt:'#f1f4f0',purple:'#7340a9',green:'#00594c',lime:'#d8f16a',yesBg:'#f0fad0',noBg:'#efe8f6'};
function setF(ctx,w,px){ctx.font=w+' '+px+'px '+FONT}
function wrapT(ctx,text,maxW){
  var out=[];String(text||'').split('\n').forEach(function(par){
    if(!par.trim()){out.push('');return}
    var line='';
    par.trim().split(/\s+/).forEach(function(w){
      var t=line?line+' '+w:w;
      if(ctx.measureText(t).width<=maxW){line=t;return}
      if(line)out.push(line);
      while(ctx.measureText(w).width>maxW){var k=w.length;while(k>1&&ctx.measureText(w.slice(0,k)).width>maxW)k--;out.push(w.slice(0,k));w=w.slice(k)}
      line=w;
    });
    out.push(line);
  });
  return out;
}
function clampL(ctx,lines,max,w){
  if(lines.length<=max)return lines;
  var o=lines.slice(0,max),l=o[max-1];
  while(l.length>1&&ctx.measureText(l+'…').width>w)l=l.slice(0,-1);
  o[max-1]=l+'…';return o;
}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function spacedW(ctx,t,sp){var w=0;for(var i=0;i<t.length;i++)w+=ctx.measureText(t[i]).width+sp;return w-sp}
function spaced(ctx,t,x,y,sp,mode){
  var w=spacedW(ctx,t,sp);if(mode==='right')x-=w;else if(mode==='center')x-=w/2;
  ctx.textAlign='left';
  for(var i=0;i<t.length;i++){ctx.fillText(t[i],x,y);x+=ctx.measureText(t[i]).width+sp}
  return w;
}
function fit(ctx,t,maxW){t=String(t);if(ctx.measureText(t).width<=maxW)return t;while(t.length>1&&ctx.measureText(t+'…').width>maxW)t=t.slice(0,-1);return t+'…'}

function mkCanvas(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');x.fillStyle=C.bg;x.fillRect(0,0,w,h);return c}

function pstats(p){
  var st=0,dc=0,en=0,ow={};
  p.nodes.forEach(function(n){if(n.type==='step')st++;else if(n.type==='decision')dc++;else en++;
    var o=(n.owner||'').trim();if(o){var k=o.toLowerCase();ow[k]=ow[k]||{name:o,n:0};ow[k].n++}});
  var owners=Object.keys(ow).map(function(k){return ow[k]});
  return {st:st,dc:dc,en:en,owners:owners};

/* ----- summary page ----- */
function summaryPage(p){
  var c=mkCanvas(PW,PH),ctx=c.getContext('2d'),maxW=PW-PM*2,S=pstats(p);
  bandFull(ctx,PW);
  setF(ctx,'800',22);ctx.fillStyle=C.green;spaced(ctx,'PROCESS SUMMARY',PM,206,5);
  setF(ctx,'700',74);ctx.fillStyle=C.ink;var tl=wrapT(ctx,ptitle(p),maxW);
  tl=clampL(ctx,tl,3,maxW);
  tl.forEach(function(l,k){ctx.fillText(l,PM,282+k*84)});
  var y=282+(tl.length-1)*84+56;
  // KPI tiles
  var tiles=[[S.st,'STEPS',C.purple],[S.dc,'DECISION POINTS',C.green],[S.en,'END POINTS','#000'],[S.owners.length,'OWNERS',C.purple]];
  var tw=(maxW-3*20)/4;
  tiles.forEach(function(t,k){var x=PM+k*(tw+20);
    ctx.save();ctx.shadowColor='rgba(23,56,47,.12)';ctx.shadowBlur=16;ctx.shadowOffsetY=5;ctx.fillStyle='#fff';rr(ctx,x,y,tw,150,20);ctx.fill();ctx.restore();
    ctx.strokeStyle=C.line;ctx.lineWidth=2;rr(ctx,x,y,tw,150,20);ctx.stroke();
    ctx.fillStyle=t[2];ctx.fillRect(x+24,y+24,36,6);
    setF(ctx,'700',70);ctx.fillStyle=t[2];ctx.textAlign='left';ctx.fillText(String(t[0]),x+24,y+102);
    setF(ctx,'700',17);ctx.fillStyle=C.muted;spaced(ctx,t[1],x+24,y+132,3);
  });
  y+=150+50;
  var T=calcTimes(p);
  if(T.any&&(T.best||T.worst)){
    var cw2=(maxW-20)/2;
    [['BEST CASE',T.best,C.lime,'#000'],['WORST CASE',T.worst,C.purple,'#fff']].forEach(function(c,k){
      var x=PM+k*(cw2+20);
      ctx.fillStyle=c[2];rr(ctx,x,y,cw2,142,20);ctx.fill();
      setF(ctx,'800',18);ctx.fillStyle=c[3];spaced(ctx,c[0],x+26,y+38,4);
      setF(ctx,'700',58);ctx.fillStyle=c[3];ctx.textAlign='left';ctx.fillText(c[1]?fmtDur(c[1].t):'n/a',x+26,y+98);
      if(c[1]){setF(ctx,'500',20);ctx.globalAlpha=.85;ctx.fillText(fit(ctx,'via steps '+c[1].path.map(function(q){return q+1}).join(' › '),cw2-52),x+26,y+128);ctx.globalAlpha=1}
    });
    setF(ctx,'500',21);ctx.fillStyle=C.muted;ctx.textAlign='left';ctx.fillText(timeNote(T),PM,y+142+30);
    y+=142+30+40;
  }
  if(p.notes&&p.notes.trim()){
    y=secHead(ctx,'OVERVIEW',y);
    setF(ctx,'400',30);var nl=clampL(ctx,wrapT(ctx,p.notes,maxW),7,maxW);
    ctx.fillStyle=C.ink;nl.forEach(function(l,k){ctx.fillText(l,PM,y+28+k*44)});y+=nl.length*44+34;
  }
  var bannerY=PH-96-30-130,limit=bannerY-16;
  if(S.owners.length){
    y=secHead(ctx,'WHO IS INVOLVED',y);
    var cx=PM,rows=0;setF(ctx,'600',26);
    S.owners.forEach(function(o){
      var t=o.name+'  ·  '+o.n+(o.n===1?' step':' steps'),w=ctx.measureText(fit(ctx,t,maxW-44)).width+44;
      if(cx+w>PM+maxW){cx=PM;y+=64;rows++}
      if(rows>2)return;
      ctx.fillStyle=C.soft;rr(ctx,cx,y,w,50,25);ctx.fill();ctx.fillStyle=C.ink;ctx.textAlign='left';ctx.fillText(fit(ctx,t,maxW-44),cx+22,y+34);cx+=w+14;
    });
    y+=50+40;
  }
  var decs=[];p.nodes.forEach(function(n,i){if(n.type==='decision')decs.push(i)});
  if(decs.length&&y<limit-200){
    y=secHead(ctx,'KEY DECISIONS',y);
    var shown=0;
    for(var d=0;d<decs.length;d++){
      var i=decs[d],n=p.nodes[i],need=60+2*44+10;
      if(y+need>limit-(d<decs.length-1?44:0)){break}
      setF(ctx,'700',30);ctx.fillStyle=C.ink;ctx.textAlign='left';
      ctx.fillText(fit(ctx,'Step '+(i+1)+'  ·  '+(n.text&&n.text.trim()||'(untitled)'),maxW),PM,y+30);
      ['yes','no'].forEach(function(b,bi){
        var br=n[b]||{},dd=dest(p,br.next,i),yy=y+44+bi*44;
        ctx.fillStyle=b==='yes'?C.lime:C.purple;rr(ctx,PM,yy,76,34,8);ctx.fill();
        setF(ctx,'800',19);ctx.fillStyle=b==='yes'?'#000':'#fff';spaced(ctx,b.toUpperCase(),PM+38,yy+25,3,'center');
        setF(ctx,'500',27);ctx.fillStyle=C.ink;ctx.textAlign='left';
        ctx.fillText(fit(ctx,((br.text&&br.text.trim())||'No action')+'   →  '+dd.label,maxW-96),PM+96,yy+26);
      });
      y+=need;shown++;
    }
    if(shown<decs.length){setF(ctx,'600',24);ctx.fillStyle=C.muted;ctx.fillText('+ '+(decs.length-shown)+' more decision'+(decs.length-shown===1?'':'s')+' in the process flow and detail pages',PM,y+24);y+=50}
    y+=24;
  }
  var ends=[];p.nodes.forEach(function(n,i){if(n.type==='end')ends.push(i)});
  if(ends.length&&y<limit-100){
    y=secHead(ctx,'HOW IT ENDS',y);
    var k=0;
    for(;k<ends.length&&y+46<limit;k++){
      var e=p.nodes[ends[k]];ctx.fillStyle='#000';ctx.beginPath();ctx.arc(PM+14,y+17,14,0,Math.PI*2);ctx.fill();
      setF(ctx,'800',16);ctx.fillStyle=C.lime;ctx.textAlign='center';ctx.fillText(String(ends[k]+1),PM+14,y+23);
      setF(ctx,'500',28);ctx.fillStyle=C.ink;ctx.textAlign='left';ctx.fillText(fit(ctx,(e.text&&e.text.trim())||'(untitled)',maxW-50),PM+44,y+27);y+=46;
    }
  }
  // closing banner
  ctx.fillStyle='#000';ctx.fillRect(PM,bannerY,maxW,130);
  var bt=ptitle(p).toUpperCase(),bf=34;setF(ctx,'700',bf);
  while(bf>22&&spacedW(ctx,bt,bf*.22)>maxW-80){bf-=2;setF(ctx,'700',bf)}
  while(bt.length>3&&spacedW(ctx,bt,bf*.22)>maxW-80)bt=bt.slice(0,-2);
  ctx.fillStyle='#fff';spaced(ctx,bt,PW/2,bannerY+58,bf*.22,'center');
  setF(ctx,'700',34);ctx.fillStyle=C.lime;spaced(ctx,S.st+(S.st===1?' STEP.  ':' STEPS.  ')+S.dc+(S.dc===1?' DECISION.':' DECISIONS.'),PW/2,bannerY+106,8,'center');
  return c;
}

/* ----- flow diagram ----- */
var COLW=480,NW=340,DW=380,GAPY=100;
function buildGraph(p){
  var N=p.nodes.length,nodes=p.nodes.map(function(n,i){return {i:i,n:n,type:n.type,virtual:false}}),edges=[];
  function virt(){var v={i:nodes.length,n:{text:'End'},type:'end',virtual:true};nodes.push(v);return v.i}
  p.nodes.forEach(function(n,i){
    if(n.type==='end')return;
    if(n.type==='decision'){['yes','no'].forEach(function(b){var br=n[b]||{},t=tgtIdx(p,br.next,i);edges.push({from:i,to:t==null?virt():t,kind:b})})}
    else{var t2=i+1<N?i+1:null;edges.push({from:i,to:t2==null?virt():t2,kind:'seq'})}
  });
  var M=nodes.length,rank=[],inc=[],i;
  for(i=0;i<M;i++)inc[i]=edges.filter(function(e){return e.to===i&&e.from<i});
  for(i=0;i<M;i++){
    if(i===0)rank[i]=1;
    else if(inc[i].length)rank[i]=Math.max.apply(null,inc[i].map(function(e){return rank[e.from]+1}));
    else rank[i]=nodes[i].virtual?1:rank[i-1];
  }
  var order=[];for(i=0;i<M;i++)order.push(i);
  order.sort(function(a,b){return rank[a]-rank[b]||a-b});
  var col=[],occ={};
  order.forEach(function(i){
    var pref=0;if(inc[i].length){var e=inc[i][0];pref=col[e.from]+(e.kind==='no'?1:0)}
    var c=pref;while(occ[rank[i]+':'+c])c++;occ[rank[i]+':'+c]=1;col[i]=c;
  });
  nodes.forEach(function(v,i){v.rank=rank[i];v.col=col[i]});
  var st={i:nodes.length,n:{text:'Start'},type:'end',virtual:true,start:true,rank:0,col:col[0]};
  nodes.push(st);edges.push({from:st.i,to:0,kind:'seq'});
  return {nodes:nodes,edges:edges,N:N};
}
function sizeGraph(ctx,G){
  G.nodes.forEach(function(v){
    if(v.virtual){v.w=150;v.h=62;return}
    var t=(v.n.text&&v.n.text.trim())||'(untitled)',ow=[(v.n.owner||'').trim(),fmtRange(v.n)].filter(Boolean).join(' · ');

    var pg=3+3*i,ct=pg+1,im=pg+2,W=(j.w*72/150).toFixed(2),H=(j.h*72/150).toFixed(2),cs='q '+W+' 0 0 '+H+' 0 0 cm /Im0 Do Q';

    obj(im,function(){push('<< /Type /XObject /Subtype /Image /Width '+j.w+' /Height '+j.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+j.bytes.length+' >>\nstream\n');push(j.bytes);push('\nendstream')});

  else if(a==='path'){var m2=el.dataset.m;state.pathMode=state.pathMode===m2?null:m2;state.sel=null;state.via=null;render();}
  else if(a==='mnode'){selectNode(+el.dataset.i,true);}
  else if(a==='mnext'){var fr=el.dataset.from!=null?+el.dataset.from:state.sel;if(fr!==state.sel)state.sel=fr;selectNode(+el.dataset.i,true,{from:fr,to:+el.dataset.i,kind:el.dataset.k||'seq'});}
  else if(a==='mstart'){state.hist=[];selectNode(0,false);}
  else if(a==='mback'){var h2=state.hist||[];if(h2.length){selectNode(h2.pop(),false)}}
  else if(a==='medit'){var nn=p.nodes[state.sel];if(nn){ctx={kind:'edit',id:nn.id,fresh:false};editSheet();}}
  else if(a==='zin'){setZoom(state.zoom*1.25);}
  else if(a==='zout'){setZoom(state.zoom/1.25);}
  else if(a==='zfit'){state.zoom=null;render();}
  else if(a==='mail'){mailSheet();}
  else if(a==='sendpdf'){sendPdf();}
  else if(a==='copy'){copyText($('#pv').value).then(function(ok){$('#cpMsg').textContent=ok?'Copied. Paste it into an email or note.':'Couldn\'t copy automatically. Tap inside the preview, select all and copy.'});}
  else if(a==='menu'){menuSheet();}
  else if(a==='dupproc'){var c2=JSON.parse(JSON.stringify(p));c2.id=uid();c2.title=(p.title||'Untitled process')+' (copy)';c2.updated=Date.now();db.procs.push(c2);save();state={view:'proc',id:c2.id};closeSheet();}
  else if(a==='delproc'){
    if(armed!=='dp'){armed='dp';el.textContent='Tap again to delete for good';setTimeout(function(){armed=null},3000);return}
    armed=null;db.procs=db.procs.filter(function(x){return x.id!==state.id});save();state={view:'lib',id:null};closeSheet();}
  else if(a==='import'){importSheet();}
  else if(a==='doimport'){
    try{var o=parseImport($('#imp').value);o.id=uid();o.updated=Date.now();o.title=o.title||'Imported process';
      o.nodes.forEach(function(n){n.id=n.id||uid()});
      db.procs.push(o);save();state={view:'proc',id:o.id};closeSheet();}
    catch(err){$('#impMsg').textContent='That doesn\'t look like a Process Mapper map. Paste the full email text including the backup block.'}}
});
function copyText(t){
  return (navigator.clipboard?navigator.clipboard.writeText(t).then(function(){return true}):Promise.reject()).catch(function(){
    try{var pv=$('#pv');pv.select();return document.execCommand('copy')}catch(e){return false}});
}
document.addEventListener('input',function(e){
  var t=e.target,p=state.view==='proc'?cur():null;
  if(t.dataset.pf&&p){p[t.dataset.pf]=t.value;touch();}
  else if(t.dataset.f&&ctx&&p){var n=p.nodes.filter(function(x){return x.id===ctx.id})[0];if(n){setPath(n,t.dataset.f,t.value);touch();}}
  else if(t.dataset.tt&&ctx&&p){readTime();}
  else if(t.dataset.e){db.email=t.value;save();updMail();}
  else if(t.id==='bk'){updMail();}
});
document.addEventListener('change',function(e){if(e.target.id==='bk')updMail();else if(e.target.dataset&&e.target.dataset.tt)readTime();});

init();render();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(function(){})}
</script>
</body>
</html>
